syntax = "proto3";

package chromelab;

option cc_enable_arenas = true;

enum ModelStatus {
    MODEL_STATUS_UNLOADED = 0;
    MODEL_STATUS_LOADING  = 1;
    MODEL_STATUS_READY    = 2;
    MODEL_STATUS_ERROR    = 3;
}

message AIStatus {
    ModelStatus status   = 1;
    string current_model = 2;
    int64 vram_bytes     = 3;
    int64 ram_bytes      = 4;
    double perplexity    = 5;
    int32 context_length = 6;
    string error         = 7;
}

message ModelInfo {
    string name              = 1;
    string filename          = 2;
    int64 size_bytes         = 3;
    string quantization      = 4;
    int32 parameters_billion = 5;
    bool loaded              = 6;
}

message ModelRequest {
    string model_name = 1;
}

message ChatMessage {
    string role    = 1;
    string content = 2;
}

message ChatRequest {
    repeated ChatMessage messages = 1;
    int32 max_tokens              = 2;
    double temperature            = 3;
    bool stream                   = 4;
}

message ChatResponse {
    string content         = 1;
    int32 tokens_generated = 2;
    double prompt_eval_ms  = 3;
    double eval_ms         = 4;
}

message ChatToken {
    string token = 1;
    bool done    = 2;
}

message ModelsList {
    repeated ModelInfo models = 1;
}
