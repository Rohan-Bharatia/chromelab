# chromelab daemon configuration
# /etc/chromelab/labd.conf

[daemon]
# Unix socket path for gRPC IPC between labd and labctl
socket = "/run/chromelab/labd.sock"

# HTTP port for the web dashboard (0 = disabled)
http_port = 8080

# Metrics collection interval in milliseconds
metrics_interval = 2000

# Log level: debug, info, warn, error
log_level = "info"

# Log file path (empty = stderr only)
log_file = "/var/log/chromelab/labd.log"

# Run as a background daemon (false = foreground, useful for debugging)
daemonize = false

# PID file path (only written when daemonize = true)
pid_file = "/run/chromelab/labd.pid"

[paths]
# Web dashboard static files directory
web_dir = "/usr/share/chromelab/web"

# AI models storage directory
models_dir = "/var/lib/chromelab/models"

# Event log storage directory
events_dir = "/var/lib/chromelab/events"

[ai]
# Enable the AI module (llama.cpp integration)
enabled = false

# Default model to auto-load on startup (empty = none)
default_model = ""

# Maximum RAM the AI module may use in bytes (0 = unlimited)
# Default: 1073741824 (1 GB) - recommended for 4GB systems
max_ram = 1073741824

[wireguard]
# Enable WireGuard remote access management
enabled = false

# WireGuard interface name
interface = "wg0"

# WireGuard listen port
listen_port = 51820

# CIDR range for VPN clients
cidr = "10.0.0.0/24"

# DNS server for VPN clients
dns = "1.1.1.1"

[dns]
# Enable local DNS resolution via dnsmasq
enabled = false

# Local domain name (resolves as <hostname>.<domain>)
domain = "lab"

[telemetry]
# Enable/disable individual metric collectors
cpu = true
memory = true
disk = true
network = true
temperature = true
load = true
processes = true
dns = true
uptime = true

# Restrict network metrics to specific interfaces (empty = all)
# Example: ["eth0", "wlan0"]
network_interfaces = []

# Restrict disk metrics to specific devices (empty = all)
# Example: ["mmcblk0", "sda"]
disk_devices = []
