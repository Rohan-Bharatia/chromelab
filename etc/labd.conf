# chromelab daemon configuration
# /etc/chromelab/labd.conf

[daemon]
# Unix socket path for gRPC IPC
socket = "/run/chromelab/labd.sock"

# HTTP port for web dashboard (0 = disabled)
http_port = 8080

# Metrics collection interval in milliseconds
metrics_interval = 2000

# Log level: debug, info, warn, error
log_level = "info"

# Log file path (empty = stderr only)
log_file = "/var/log/chromelab/labd.log"

[paths]
# Web dashboard static files
web_dir = "/usr/share/chromelab/web"

# AI models directory
models_dir = "/var/lib/chromelab/models"

# Event log storage
events_dir = "/var/lib/chromelab/events"

[ai]
# Enable the AI module
enabled = false

# Default model to load on startup (empty = none)
default_model = ""

# Maximum RAM the AI module may use (bytes, 0 = unlimited)
max_ram = 1073741824  # 1 GB

[wireguard]
# Enable WireGuard management
enabled = false

# WireGuard interface name
interface = "wg0"

# Listen port
listen_port = 51820"

# CIDR for VPN clients
cidr = "10.0.0.0/24"

# DNS for VPN clients
dns = "1.1.1.1"

[dns]
# Enable local DNS via dnsmasq
enabled = false

# Local domain
domain = "lab"

[telemetry]
# Which collectors to enable
cpu = true
memory = true
disk = true
network = true
temperature = true
load = true
processes = true
dns = true
uptime = true

# Per-interface filter (empty = all)
network_interfaces = []

# Per-disk filter (empty = all)
disk_devices = []
